<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Winkify">
<title>Winkify</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:#fff;font-family:"Circular Std","Circular",CircularSp,"Helvetica Neue",Helvetica,Arial,"Segoe UI",Roboto,sans-serif;font-size:14px;overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block;flex:none}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.3);border-radius:6px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.5);background-clip:content-box;border:3px solid transparent}
::-webkit-scrollbar-track{background:transparent}

/* ---------- LOGIN ---------- */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#1f3a2a,#000 60%);z-index:100;padding:16px}
#login form{width:100%;max-width:400px;background:#121212;border-radius:12px;padding:40px 32px;display:flex;flex-direction:column;gap:14px}
#login .logo{display:flex;justify-content:center;margin-bottom:8px}
#login h1{font-size:28px;text-align:center;font-weight:800;margin-bottom:8px}
#login label{font-size:13px;font-weight:700;display:flex;flex-direction:column;gap:6px}
#login input{background:#121212;border:1px solid #727272;border-radius:4px;color:#fff;padding:12px;font-size:15px;outline:none}
#login input:focus{border-color:#fff;box-shadow:0 0 0 1px #fff}
#login .btn{background:#1ed760;color:#000;font-weight:800;border-radius:500px;padding:14px;font-size:16px;margin-top:8px}
#login .btn:hover{background:#3be477;transform:scale(1.02)}
#lerr{color:#f3727f;font-size:13px;min-height:18px;line-height:1.4}

/* ---------- LAYOUT DESKTOP ---------- */
#app{display:none;height:100vh;height:100dvh;background:#000;padding:0 8px 0;gap:8px;grid-template-columns:320px 1fr;grid-template-rows:64px minmax(0,1fr) 72px}
#app.on{display:grid}
#app.q-open{grid-template-columns:320px 1fr 340px}
#topbar{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:0 8px}
#topbar .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;width:240px}
#topbar .mid{display:flex;align-items:center;gap:8px;flex:1;justify-content:center;max-width:720px}
#topbar .right{width:240px;display:flex;justify-content:flex-end}
.circ{width:48px;height:48px;border-radius:50%;background:#1f1f1f;display:flex;align-items:center;justify-content:center;flex:none}
.circ:hover{background:#2a2a2a;transform:scale(1.04)}
#sbox{flex:1;height:48px;border-radius:500px;background:#1f1f1f;display:flex;align-items:center;gap:10px;padding:0 14px;color:#b3b3b3;border:2px solid transparent;transition:background .15s}
#sbox:hover{background:#2a2a2a}
#sbox:focus-within{border-color:#fff;background:#2a2a2a;color:#fff}
#sbox input,.msearch input{flex:1;background:none;border:0;outline:0;color:#fff;font-size:15px;min-width:0}
#sbox input::placeholder,.msearch input::placeholder{color:#a7a7a7}
.avatar{width:32px;height:32px;border-radius:50%;background:#1ed760;color:#000;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px;text-transform:uppercase;box-shadow:0 0 0 8px #1f1f1f;margin-right:8px}
.avatar:hover{transform:scale(1.06)}

.panel{background:#121212;border-radius:8px;overflow:hidden;min-height:0}
#sidebar{display:flex;flex-direction:column;min-height:0}
#sidebar .panel{flex:1;display:flex;flex-direction:column}
#main{position:relative;background:#121212;border-radius:8px;overflow-y:auto;min-height:0}
#scroll{position:relative;min-height:100%;padding-bottom:32px}
#hero{position:absolute;top:0;left:0;right:0;height:340px;pointer-events:none;z-index:0}
#view{position:relative;z-index:1}
.navarr{position:sticky;top:16px;height:0;z-index:6;padding:0 16px;display:flex;gap:8px}
.navarr button{width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center}
.navarr button:hover{background:rgba(0,0,0,.9)}

#queue{display:none;background:#121212;border-radius:8px;flex-direction:column;min-height:0;overflow:hidden}
#app.q-open #queue{display:flex}
#queue .qh{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 8px;font-weight:800;font-size:16px}
#queue .qb{overflow-y:auto;padding:0 8px 16px;flex:1}
#queue h4{font-size:15px;color:#b3b3b3;padding:12px 8px 6px;font-weight:700}
.qi{display:flex;align-items:center;gap:12px;padding:8px;border-radius:4px;cursor:pointer}
.qi:hover{background:#2a2a2a}
.qi .cov{width:40px;height:40px;border-radius:4px}
.qi .t{min-width:0;flex:1}
.qi .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.qi .ar{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#b3b3b3;font-size:13px;margin-top:2px}
.qi.cur .nm{color:#1ed760}

/* ---------- LIBRERIA ---------- */
.lib-h{display:flex;align-items:center;gap:10px;padding:16px 16px 8px;font-weight:700;font-size:16px;color:#b3b3b3}
.chips{display:flex;gap:8px;padding:8px 16px;flex-wrap:wrap}
.chip{background:#2a2a2a;border-radius:500px;padding:6px 12px;font-size:13px;white-space:nowrap}
.chip:hover{background:#333}
.chip.on{background:#fff;color:#000}
.lib-s{padding:4px 16px 8px;display:flex;justify-content:flex-end}
.lib-s button{color:#b3b3b3;font-size:13px;display:flex;gap:6px;align-items:center}
.lib-s button:hover{color:#fff;transform:scale(1.03)}
.lib-list{overflow-y:auto;padding:0 8px 8px;flex:1;min-height:0}
.li{display:flex;align-items:center;gap:12px;padding:8px;border-radius:6px}
.li:hover{background:#1f1f1f}
.li.active{background:#2a2a2a}
.li .cov{width:48px;height:48px;border-radius:4px}
.li .cov.round{border-radius:50%}
.li .t{min-width:0}
.li .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
.li .sb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#b3b3b3;font-size:14px;margin-top:2px}
.li.liked .nm{color:#fff}
.cov.likedcov,.likedcov{background:linear-gradient(135deg,#450af5,#c4efd9);display:flex;align-items:center;justify-content:center;color:#fff;border-radius:4px}

/* ---------- COPERTINE ---------- */
.cov{position:relative;background:#282828;display:flex;align-items:center;justify-content:center;color:#7f7f7f;overflow:hidden;flex:none;border-radius:4px}
.cov svg{width:40%;height:40%}
.cov img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cov.round{border-radius:50%}

/* ---------- SCAFFALI E CARD ---------- */
.pad{padding:0 24px}
.shelf{padding:0 24px;margin-top:28px}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.sh h2,.sec-t{font-size:24px;font-weight:800;letter-spacing:-.3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));grid-template-rows:1fr;grid-auto-rows:0;overflow:hidden;column-gap:16px;margin:0 -12px}
.grid.all{grid-template-rows:none;grid-auto-rows:auto;overflow:visible}
.card{padding:12px;border-radius:8px;background:transparent;position:relative;display:block;min-width:0;transition:background .3s}
.card:hover{background:#1f1f1f}
.ci{position:relative;width:100%;aspect-ratio:1;margin-bottom:12px;box-shadow:0 8px 24px rgba(0,0,0,.5);border-radius:6px}
.ci .cov{position:absolute;inset:0;border-radius:6px}
.ci.round,.ci.round .cov{border-radius:50%}
.ct{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.cs{color:#a7a7a7;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cplay{position:absolute;right:8px;bottom:8px;width:48px;height:48px;border-radius:50%;background:#1ed760;color:#000;display:flex;align-items:center;justify-content:center;opacity:0;transform:translateY(8px);transition:all .3s;box-shadow:0 8px 8px rgba(0,0,0,.3)}
.card:hover .cplay,.qt:hover .cplay{opacity:1;transform:none}
.cplay:hover{transform:scale(1.06)!important;background:#3be477}

.greet{font-size:30px;font-weight:800;padding:72px 24px 16px;letter-spacing:-.5px}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px 16px;padding:0 24px}
.qt{display:flex;align-items:center;gap:0;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden;position:relative;height:64px;font-weight:700;font-size:16px;transition:background .3s}
.qt:hover{background:rgba(255,255,255,.2)}
.qt .qi2{width:64px;height:64px;flex:none;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.qt .qi2 .cov{width:100%;height:100%;border-radius:0}
.qt span{padding:0 16px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.qt .cplay{width:48px;height:48px;right:12px;bottom:8px}

/* ---------- HEADER ENTITÀ ---------- */
.hd{display:flex;align-items:flex-end;gap:24px;padding:72px 24px 24px;min-height:300px}
.hd .cov{width:232px;height:232px;border-radius:4px;box-shadow:0 4px 60px rgba(0,0,0,.5);flex:none}
.hd .cov.round{border-radius:50%}
.hd .meta{min-width:0}
.hd .kind{font-size:13px;font-weight:700;text-transform:none}
.hd h1{font-size:clamp(32px,6vw,88px);font-weight:900;letter-spacing:-2px;line-height:1.05;margin:6px 0 12px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.hd h1.long{font-size:clamp(24px,3.6vw,48px);letter-spacing:-1px}
.hd .info{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:14px;color:#ddd}
.hd .info b{font-weight:800;color:#fff}
.hd .info a:hover{text-decoration:underline}
.hd .desc{color:#b3b3b3;font-size:14px;margin-bottom:8px}
.likedhd{background:linear-gradient(135deg,#450af5,#c4efd9);color:#fff;display:flex;align-items:center;justify-content:center}
.likedhd svg{width:96px;height:96px}
.actions{display:flex;align-items:center;gap:24px;padding:24px 24px 16px;position:relative}
.bigplay{width:56px;height:56px;border-radius:50%;background:#1ed760;color:#000;display:flex;align-items:center;justify-content:center}
.bigplay:hover{transform:scale(1.06);background:#3be477}
.ib{color:#b3b3b3;display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%}
.ib:hover{color:#fff;transform:scale(1.08)}
.ib.on{color:#1ed760}
.ib.big svg{width:32px;height:32px}
.heart.on{color:#1ed760}

.ahero{height:340px;background-size:cover;background-position:center 25%;background-color:#333;position:relative;display:flex;align-items:flex-end;padding:24px}
.ahero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 30%,rgba(0,0,0,.75))}
.ahero>div{position:relative;z-index:1}
.ahero h1{font-size:clamp(40px,8vw,96px);font-weight:900;letter-spacing:-3px;line-height:1;text-shadow:0 2px 12px rgba(0,0,0,.4)}
.ahero .sub{font-size:16px;margin-top:12px}
.abody{background:linear-gradient(180deg,rgba(0,0,0,.45),#121212 240px)}
.bio{color:#b3b3b3;font-size:15px;line-height:1.6;max-width:640px;white-space:pre-line}

/* ---------- TABELLA BRANI ---------- */
.tt-wrap{padding:0 16px}
.row{display:grid;grid-template-columns:40px minmax(0,6fr) minmax(0,4fr) 150px;gap:16px;align-items:center;height:56px;padding:0 16px;border-radius:4px;color:#b3b3b3;position:relative}
.noal .row{grid-template-columns:40px minmax(0,1fr) 150px}
.row.hdr{height:36px;border-bottom:1px solid rgba(255,255,255,.1);border-radius:0;margin-bottom:8px;font-size:13px;letter-spacing:.5px;text-transform:none;position:sticky;top:0;background:#121212;z-index:2}
.row:not(.hdr):hover{background:rgba(255,255,255,.1)}
.row.sel{background:rgba(255,255,255,.2)}
.row .num{display:flex;align-items:center;justify-content:flex-end;font-size:16px;width:100%}
.row .num .pl,.row .num .eq{display:none}
.row:not(.hdr):hover .num .n{display:none}
.row:not(.hdr):hover .num .pl{display:flex;color:#fff}
.row.playing .num .n{display:none}
.row.playing .num .eq{display:flex}
.row.playing:hover .num .eq{display:none}
.row.playing .nm{color:#1ed760}
.row .tt{display:flex;align-items:center;gap:14px;min-width:0}
.row .tt .cov{width:40px;height:40px;border-radius:4px}
.row .t{min-width:0}
.row .nm{color:#fff;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ar{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row .ar a:hover,.row .al a:hover{text-decoration:underline;color:#fff}
.row:hover .ar{color:#fff}
.row .al{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.row .du{display:flex;align-items:center;justify-content:flex-end;gap:12px;font-size:14px}
.row .du .heart{opacity:0}
.row:hover .du .heart,.row .du .heart.on{opacity:1}
.row .du .more{opacity:0}
.row:hover .du .more{opacity:1}
.row .du .tm{min-width:40px;text-align:right}
.eq{align-items:flex-end;gap:2px;height:14px;color:#1ed760}
.eq i{display:block;width:3px;background:#1ed760;animation:eq 1s infinite ease-in-out}
.eq i:nth-child(1){height:60%;animation-delay:-.4s}.eq i:nth-child(2){height:100%;animation-delay:-.2s}.eq i:nth-child(3){height:40%;animation-delay:-.7s}.eq i:nth-child(4){height:80%;animation-delay:-.1s}
.paused .eq i{animation-play-state:paused}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.eq i{transform-origin:bottom}

/* ---------- RICERCA ---------- */
.msearch{display:none}
.stitle{font-size:16px;font-weight:700;padding:24px 24px 0}
.gtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:24px;padding:16px 24px 24px}
.tile{position:relative;aspect-ratio:1.8;border-radius:8px;padding:16px;font-size:24px;font-weight:800;overflow:hidden;letter-spacing:-.5px;word-break:break-word;display:block}
.tile:hover{filter:brightness(1.08)}
.tile::after{content:"";position:absolute;right:-18px;bottom:-6px;width:92px;height:92px;background:rgba(0,0,0,.22);border-radius:8px;transform:rotate(25deg)}
.schips{display:flex;gap:8px;padding:72px 24px 0}
.two{display:grid;grid-template-columns:minmax(300px,2fr) 3fr;gap:24px;padding:0 24px;margin-top:24px}
.two h2{font-size:24px;font-weight:800;margin-bottom:16px}
.two .tt-wrap{padding:0}
.topres{background:#181818;border-radius:8px;padding:20px;position:relative;display:block;height:230px}
.topres:hover{background:#282828}
.topres .cov{width:92px;height:92px;margin-bottom:20px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.topres h3{font-size:30px;font-weight:800;letter-spacing:-1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topres .tag{display:inline-block;margin-top:8px;background:#121212;border-radius:500px;padding:4px 12px;font-size:13px;font-weight:700}
.topres .cplay{right:20px;bottom:20px}
.topres:hover .cplay{opacity:1;transform:none}
.empty{padding:120px 24px;text-align:center;color:#b3b3b3}
.empty h3{color:#fff;font-size:24px;margin-bottom:8px}
.err{padding:120px 24px;text-align:center;color:#b3b3b3}
.err h3{color:#fff;margin-bottom:8px;font-size:22px}

/* ---------- PLAYER ---------- */
#player{grid-column:1/-1;display:grid;grid-template-columns:minmax(180px,30%) 1fr minmax(180px,30%);align-items:center;padding:0 8px;position:relative}
.pl-left{display:flex;align-items:center;gap:14px;min-width:0}
#pcov .cov{width:56px;height:56px;border-radius:4px}
.pinfo{min-width:0}
#ptitle{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ptitle a:hover,#partist a:hover{text-decoration:underline}
#partist{font-size:12px;color:#b3b3b3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
#partist a:hover{color:#fff}
.pl-mid{display:flex;flex-direction:column;align-items:center;gap:8px;max-width:722px;width:100%;margin:0 auto}
.ctrls{display:flex;align-items:center;gap:16px}
.ctrls .ib{position:relative}
.ctrls .pp{width:32px;height:32px;border-radius:50%;background:#fff;color:#000;display:flex;align-items:center;justify-content:center}
.ctrls .pp:hover{transform:scale(1.06)}
.rb{position:absolute;font-size:9px;font-weight:800;right:4px;top:6px;background:#1ed760;color:#000;border-radius:50%;width:11px;height:11px;display:flex;align-items:center;justify-content:center}
.seek{display:flex;align-items:center;gap:8px;width:100%;font-size:11px;color:#a7a7a7}
.seek span{min-width:40px;text-align:center}
.seek span:first-child{text-align:right}
.seek input{flex:1}
.pl-right{display:flex;align-items:center;justify-content:flex-end;gap:6px}
.pl-right #vol{width:100px}
input[type=range]{-webkit-appearance:none;appearance:none;height:12px;background:transparent;cursor:pointer;--p:0%;--f:#fff;outline:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--f) var(--p),#4d4d4d var(--p))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:#4d4d4d}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--f)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;margin-top:-4px;opacity:0;box-shadow:0 2px 4px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:#fff;opacity:0}
input[type=range]:hover{--f:#1ed760}
input[type=range]:hover::-webkit-slider-thumb,input[type=range]:active::-webkit-slider-thumb{opacity:1}
input[type=range]:hover::-moz-range-thumb{opacity:1}
#mprog{display:none}
.cur-dim{opacity:.4;pointer-events:none}

/* ---------- MENU / TOAST ---------- */
#menu{position:fixed;display:none;z-index:200;background:#282828;border-radius:4px;padding:4px;min-width:220px;box-shadow:0 16px 24px rgba(0,0,0,.5)}
#menu button{display:block;width:100%;text-align:left;padding:11px 12px;font-size:14px;border-radius:2px;color:#e6e6e6}
#menu button:hover{background:#3e3e3e;color:#fff}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:#fff;color:#000;font-weight:700;padding:12px 20px;border-radius:8px;opacity:0;pointer-events:none;transition:all .25s;z-index:300;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%)}

/* ---------- ELEMENTI SOLO MOBILE ---------- */
#bottomnav,#fp{display:none}


/* ---------- TESTI ---------- */
#lyr{display:none;flex-direction:column;border-radius:8px;overflow:hidden;min-height:0;position:relative;background-color:rgb(var(--lc,83,83,83));background-image:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.42));transition:background-color .6s}
#app.lyr-open #main{display:none}
#app.lyr-open #lyr{display:flex}
#lyr .lh{display:flex;align-items:center;gap:12px;padding:16px 20px 8px;flex:none}
#lyr .lt{min-width:0;flex:1}
#lytitle{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lyartist{font-size:13px;color:rgba(255,255,255,.78);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
#lysrc{font-size:12px;color:rgba(255,255,255,.72);white-space:nowrap}
#lyr .ib{color:#fff}
#lybody{position:relative;flex:1;overflow-y:auto;padding:42vh 32px;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 12%,#000 88%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 12%,#000 88%,transparent 100%);scrollbar-width:none}
#lybody::-webkit-scrollbar{display:none}
.ll{max-width:880px;margin:0 auto;padding:9px 0;font-size:clamp(24px,2.5vw,38px);font-weight:800;line-height:1.25;letter-spacing:-.5px;opacity:.38;transform-origin:left center;transition:opacity .35s,transform .35s;cursor:pointer;word-break:break-word}
.ll.past{opacity:.6}
.ll.on{opacity:1;transform:scale(1.04)}
.ll:hover{opacity:.85}
.ll.on:hover{opacity:1}

/* =====================================================================
   WINKIFY — client web per Navidrome (API Subsonic), interfaccia in stile Spotify
   Tutto in un solo file, senza dipendenze esterne.
   ===================================================================== */

/* ---------- utilità ---------- */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };
const fmtLong = s => { s = Math.floor(s||0); const h = Math.floor(s/3600), m = Math.floor(s%3600/60); return h ? `${h} h ${m} min` : `${m} min ${s%60} s`; };
const isMobile = () => matchMedia('(max-width:800px)').matches;
let toastT;
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2600); }

/* ---------- MD5 (necessario per il token Subsonic) ---------- */
function md5(str){
  const u = unescape(encodeURIComponent(str));
  const S=[7,12,17,22,7,12,17,22,7,12,17,22,7,12,17,22,5,9,14,20,5,9,14,20,5,9,14,20,5,9,14,20,4,11,16,23,4,11,16,23,4,11,16,23,4,11,16,23,6,10,15,21,6,10,15,21,6,10,15,21,6,10,15,21];
  const K=[]; for(let i=0;i<64;i++) K[i]=Math.floor(Math.abs(Math.sin(i+1))*4294967296)>>>0;
  const n=u.length, w=[];
  for(let i=0;i<n;i++) w[i>>2]|=u.charCodeAt(i)<<((i%4)*8);
  w[n>>2]|=0x80<<((n%4)*8);
  const len=(((n+8)>>6)+1)*16;
  for(let i=0;i<len;i++) w[i]=w[i]|0;
  w[len-2]=n*8;
  let a0=0x67452301,b0=0xefcdab89|0,c0=0x98badcfe|0,d0=0x10325476;
  for(let o=0;o<len;o+=16){
    let A=a0,B=b0,C=c0,D=d0;
    for(let i=0;i<64;i++){
      let F,g;
      if(i<16){F=(B&C)|(~B&D);g=i;}
      else if(i<32){F=(D&B)|(~D&C);g=(5*i+1)%16;}
      else if(i<48){F=B^C^D;g=(3*i+5)%16;}
      else{F=C^(B|~D);g=(7*i)%16;}
      F=(F+A+K[i]+w[o+g])|0;
      A=D;D=C;C=B;
      B=(B+((F<<S[i])|(F>>>(32-S[i]))))|0;
    }
    a0=(a0+A)|0;b0=(b0+B)|0;c0=(c0+C)|0;d0=(d0+D)|0;
  }
  return [a0,b0,c0,d0].map(v=>{let s='';for(let i=0;i<4;i++)s+=((v>>>(i*8))&255).toString(16).padStart(2,'0');return s;}).join('');
}

function installAppIcons(){
  try{
    const setLink=(rel,href,extra={})=>{ let l=document.querySelector(`link[rel="${rel}"]`); if(!l){ l=document.createElement('link'); l.rel=rel; document.head.appendChild(l); } l.href=href; Object.entries(extra).forEach(([k,v])=>l.setAttribute(k,v)); };
    setLink('icon', wkUri('round',64), {type:'image/svg+xml'});
    const png=(kind,size)=>new Promise(res=>{ const im=new Image(); im.onload=()=>{ try{ const c=document.createElement('canvas'); c.width=c.height=size; c.getContext('2d').drawImage(im,0,0,size,size); res(c.toDataURL('image/png')); }catch(e){ res(null); } }; im.onerror=()=>res(null); im.src=wkUri(kind,size); });
    Promise.all([png('square',180),png('round',192),png('round',512),png('square',512)]).then(([a,b,c,d])=>{
      if(a) setLink('apple-touch-icon',a,{sizes:'180x180'});
      if(/^https?:$/.test(location.protocol) && b && c && d){
        const dir=location.origin+location.pathname.replace(/[^/]*$/,'');
        const man={name:'Winkify',short_name:'Winkify',display:'standalone',background_color:'#000000',theme_color:'#000000',start_url:location.origin+location.pathname,scope:dir,
          icons:[{src:b,sizes:'192x192',type:'image/png',purpose:'any'},{src:c,sizes:'512x512',type:'image/png',purpose:'any'},{src:d,sizes:'512x512',type:'image/png',purpose:'maskable'}]};
        setLink('manifest', URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/manifest+json'})));
      }
    });
  }catch(e){}
}

/* ---------- sessione e API Subsonic ---------- */
let S = null;
try { S = JSON.parse(localStorage.getItem('winkify_session') || localStorage.getItem('melodia_session')); } catch(e){}
function apiUrl(ep, p={}){
  const q = new URLSearchParams({u:S.user, t:S.token, s:S.salt, v:'1.16.1', c:'Winkify', f:'json'});
  for(const [k,v] of Object.entries(p)){
    if(v==null) continue;
    if(Array.isArray(v)) v.forEach(x=>q.append(k,x)); else q.set(k,v);
  }
  return `${S.server}/rest/${ep}?${q}`;
}
async function api(ep, p={}){
  const r = await fetch(apiUrl(ep,p));
  if(!r.ok) throw new Error('HTTP '+r.status);
  const j = await r.json();
  const s = j['subsonic-response'];
  if(!s || s.status!=='ok') throw new Error(s?.error?.message || 'Errore del server');
  return s;
}
const coverUrl = (id, sz=300) => id ? apiUrl('getCoverArt',{id,size:sz}) : '';
const cov = (id, sz=300, cls='') => `<div class="cov ${cls}">${ic('note')}${id?`<img loading="lazy" decoding="async" src="${coverUrl(id,sz)}" alt="" onerror="this.remove()">`:''}</div>`;

/* ---------- colori ---------- */
const colorCache = {};
function hashColor(str){
  let h=0; for(const c of String(str)) h=(h*31+c.charCodeAt(0))>>>0;
  return hsl2rgb(h%360, .42, .3);
}
function hsl2rgb(h,s,l){
  const a=s*Math.min(l,1-l), f=n=>{const k=(n+h/30)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1));};
  return [Math.round(f(0)*255),Math.round(f(8)*255),Math.round(f(4)*255)];
}
function dom(id){
  if(!id) return Promise.resolve([83,83,83]);
  if(colorCache[id]) return Promise.resolve(colorCache[id]);
  return new Promise(res=>{
    const done = c => { colorCache[id]=c; res(c); };
    const im = new Image(); im.crossOrigin='anonymous';
    im.onload = () => {
      try{
        const c=document.createElement('canvas'); c.width=c.height=16;
        const x=c.getContext('2d'); x.drawImage(im,0,0,16,16);
        const d=x.getImageData(0,0,16,16).data; let r=0,g=0,b=0,n=0;
        for(let i=0;i<d.length;i+=4){
          const mx=Math.max(d[i],d[i+1],d[i+2]), mn=Math.min(d[i],d[i+1],d[i+2]);
          const w=1+(mx-mn)/40; r+=d[i]*w; g+=d[i+1]*w; b+=d[i+2]*w; n+=w;
        }
        r/=n; g/=n; b/=n;
        const L=.299*r+.587*g+.114*b;
        if(L>105){const k=105/L; r*=k; g*=k; b*=k;}
        else if(L<45){r+=30; g+=30; b+=30;}
        done([Math.round(r),Math.round(g),Math.round(b)]);
      }catch(e){ done(hashColor(id)); }
    };
    im.onerror = () => done(hashColor(id));
    im.src = coverUrl(id,48);
  });
}

/* ---------- stato libreria / preferiti ---------- */
const LIB = {playlists:[], artists:[], albums:[], filter:null, sort:'recent', loaded:false};
let starred = new Set(), starredAlb = new Set();
const LISTS = [];

async function loadLibrary(){
  const [pl, ar, st] = await Promise.all([
    api('getPlaylists').catch(()=>({})), api('getArtists').catch(()=>({})), api('getStarred2').catch(()=>({}))
  ]);
  LIB.playlists = pl.playlists?.playlist || [];
  LIB.artists = (ar.artists?.index || []).flatMap(i=>i.artist||[]);
  const s = st.starred2 || {};
  starred = new Set((s.song||[]).map(x=>x.id));
  starredAlb = new Set((s.album||[]).map(x=>x.id));
  LIB.loaded = true; renderLibrary(); refreshHearts();
  const all=[]; let off=0;
  try{
    for(;;){
      const r = await api('getAlbumList2',{type:'alphabeticalByName',size:500,offset:off});
      const a = r.albumList2?.album || [];
      all.push(...a);
      if(a.length<500 || all.length>=5000) break;
      off+=500;
    }
  }catch(e){}
  LIB.albums = all; renderLibrary();
}

function libItems(){
  const f = LIB.filter, items=[];
  if(!f || f==='playlists'){
    if(!f) items.push({k:'liked',name:'Brani che ti piacciono',sub:'Playlist • Preferiti',href:'#/liked',date:Infinity});
    LIB.playlists.forEach(p=>items.push({k:'playlist',name:p.name,sub:`Playlist • ${esc(p.owner||'')}`,img:p.coverArt||p.id,href:'#/playlist/'+p.id,pid:p.id,date:Date.parse(p.changed)||0}));
  }
  if(!f || f==='albums') LIB.albums.forEach(a=>items.push({k:'album',name:a.name||a.title,sub:`Album • ${esc(a.artist||'')}`,img:a.coverArt||a.id,href:'#/album/'+a.id,date:Date.parse(a.created)||0}));
  if(!f || f==='artists') LIB.artists.forEach(a=>items.push({k:'artist',name:a.name,sub:'Artista',img:a.coverArt||a.id,href:'#/artist/'+a.id,date:-1}));
  if(LIB.sort==='alpha'){ items.sort((a,b)=>(a.k==='liked'?-1:b.k==='liked'?1:0)||String(a.name).localeCompare(String(b.name),'it',{sensitivity:'base'})); }
  else items.sort((a,b)=>b.date-a.date);
  return items;
}

  const items = libItems();

  }).join('') || `<div class="empty" style="padding:40px 16px">${LIB.loaded?'Nessun elemento':'Caricamento…'}</div>`;

/* ---------- MOTORE AUDIO: due elementi <audio> (gapless + crossfade) ---------- */
/* Il brano successivo viene precaricato su un secondo elemento. A fine brano parte subito (gapless) oppure, se la dissolvenza e'
   attiva, parte qualche secondo prima mentre il brano in corso sfuma (equal-power). Tutto il resto dell'app continua a usare `audio`. */
const XA = [new Audio(), new Audio()]; XA.forEach(a=>{ a.preload='auto'; a._g=1; });
let localAudio = XA[0];
const XV = {v:.8, m:false};
const XF = {sec:4, album:true, pre:null, fade:null, ft:0, ahead:14, canVol:true};
try{ const j=JSON.parse(localStorage.getItem('winkify_xf')||'null'); if(j){ XF.sec=Math.max(0,Math.min(12,+j.sec||0)); XF.album=j.album!==false; } }catch(e){}
try{ const t=new Audio(); t.volume=.5; XF.canVol = Math.abs(t.volume-.5)<.01; }catch(e){ XF.canVol=false; }
/* `audio` ha la stessa interfaccia usata da tutta l'app (src, play, pause, currentTime, duration, paused, volume, muted, eventi),
   ma quando si sta trasmettendo a un Chromecast i comandi vanno al dispositivo remoto invece che all'elemento <audio> locale. */
const CAST = {ready:false, on:false, name:'', why:'', player:null, ctrl:null, loading:false, needLoad:true, base:0, baseAt:0, srcUrl:'', lastPlaying:false, ended:false, resume:null, vol:null, tick:0};
const AB = new EventTarget();
const castSt = () => CAST.player ? CAST.player.playerState : null;
const castPlaying = () => CAST.loading || castSt()==='PLAYING' || castSt()==='BUFFERING';
const castDur = () => (CAST.player && CAST.player.duration) || (cur() && cur().duration) || 0;
const castTime = () => {
  let t = CAST.base;
  if(castSt()==='PLAYING' && !CAST.loading) t += (performance.now()-CAST.baseAt)/1000;
  const d=castDur(); return d ? Math.min(t,d) : Math.max(0,t);
};
const audio = {
  get src(){ return CAST.srcUrl; },
  set src(u){ CAST.srcUrl=u; CAST.needLoad=true; CAST.ended=false; if(!CAST.on) localAudio.src=u; },
  get currentTime(){ return CAST.on ? castTime() : localAudio.currentTime; },
  set currentTime(v){
    if(!CAST.on){ localAudio.currentTime=v; return; }
    CAST.base=v; CAST.baseAt=performance.now();
    if(CAST.player.mediaInfo && castSt() && castSt()!=='IDLE'){ CAST.player.currentTime=v; CAST.ctrl.seek(); }
    AB.dispatchEvent(new Event('timeupdate'));
  },
  get duration(){ return CAST.on ? castDur() : localAudio.duration; },
  get paused(){ return CAST.on ? !castPlaying() : localAudio.paused; },
  get playbackRate(){ return CAST.on ? 1 : localAudio.playbackRate; },
  get volume(){ return XV.v; },
  set volume(v){ XV.v=v; xfApplyVol(); if(CAST.on && CAST.player){ CAST.player.volumeLevel=v; CAST.ctrl.setVolumeLevel(); } },
  get muted(){ return XV.m; },
  set muted(m){ XV.m=!!m; xfApplyVol(); if(CAST.on && CAST.player && CAST.player.isMuted!==m) CAST.ctrl.muteOrUnmute(); },
  play(){
    if(!CAST.on) return localAudio.play();
    const st=castSt();
    if(CAST.needLoad || !CAST.player.mediaInfo || !st || st==='IDLE') return castLoad(cur(),0,true);
    if(CAST.player.isPaused) CAST.ctrl.playOrPause();
    return Promise.resolve();
  },
  pause(){
    if(!CAST.on){ if(XF.fade) xfStopFade(); localAudio.pause(); return; }
    if(castSt()==='PLAYING' || castSt()==='BUFFERING') CAST.ctrl.playOrPause();
  },
  addEventListener(t,f,o){ AB.addEventListener(t,f,o); }

XA.forEach(el=>['timeupdate','ended','play','pause','error','seeked','durationchange'].forEach(t=>el.addEventListener(t,()=>{ if(!CAST.on && el===localAudio) AB.dispatchEvent(new Event(t)); })));
function xfApplyVol(){
  XA.forEach(e=>{ const g=Math.max(0,Math.min(1,XV.v*(e._g==null?1:e._g))); try{ e.volume=g; }catch(x){} e.muted=XV.m; });

/* indice del brano che parte dopo quello in corso (-1 = nessuno / ripeti un brano) */
function xfNextIdx(){
  if(!P.queue.length || P.repeat===2) return -1;
  if(P.i < P.queue.length-1) return P.i+1;
  if(P.repeat===1 && P.queue.length>1) return 0;
  return -1;
}
/* durata effettiva della dissolvenza fra il brano corrente e il prossimo (0 = gapless puro) */
function xfLen(dur, next){
  if(!XF.canVol || XF.sec<=0) return 0;
  const s=cur();
  if(XF.album && s && next && s.albumId && s.albumId===next.albumId && (next.discNumber||1)===(s.discNumber||1) && next.track && next.track===(s.track||0)+1) return 0;
  return Math.max(0, Math.min(XF.sec, dur*.4));
}
function xfPrepare(){
  const ni=xfNextIdx(); if(ni<0){ XF.pre=null; return; }
  const s=P.queue[ni]; if(!s) return;
  if(XF.pre && XF.pre.id===s.id && XF.pre.idx===ni) return;
  const el = XA[0]===localAudio ? XA[1] : XA[0];
  if(XF.fade && XF.fade.old===el) return;
  if(!el.paused && !el.ended) return;      /* l'altro elemento sta ancora finendo il brano precedente */
  const url=apiUrl('stream',{id:s.id});
  try{ el.pause(); }catch(e){}
  el.src=url; el.preload='auto'; el.load();
  XF.pre={id:s.id, idx:ni, el, url};
}
function xfStopFade(){
  const f=XF.fade; clearInterval(XF.ft); XF.ft=0;

function xfRamp(){
  const f=XF.fade; if(!f){ clearInterval(XF.ft); return; }

function xfTick(){

let scrobbled = false, dragging = false;
const cur = () => P.queue[P.i];

function shuffleQueue(){
  const c = P.queue[P.i];
  const rest = P.queue.filter((_,k)=>k!==P.i);
  for(let k=rest.length-1;k>0;k--){ const j=Math.floor(Math.random()*(k+1)); [rest[k],rest[j]]=[rest[j],rest[k]]; }
  P.queue = c ? [c,...rest] : rest; P.i = 0;
}
function playList(list, idx=0, {ctx=null, random=false}={}){

/* ---------- TESTI (sincronizzati) ---------- */
/* Fonti, in ordine: 1) Navidrome (testi incorporati / file .lrc, OpenSubsonic getLyricsBySongId)
   2) LRCLIB (lrclib.net, gratuito, senza chiave, CORS abilitato) 3) getLyrics classico (solo testo). */
const LY = {open:false, id:null, data:null, status:'idle', idx:-2, tok:0, skip:0, els:[], cels:[], raf:0};
const lyCache = new Map();
const LRC_BASE = 'https://lrclib.net/api';
let lrcHdr = true;

function parseLrc(txt){
  const out=[]; let off=0;
  for(const raw of String(txt).split(/\r?\n/)){
    const o=raw.match(/^\s*\[offset:\s*(-?\d+)\s*\]/i); if(o){ off=+o[1]; continue; }
    const m=[...raw.matchAll(/\[(\d+):(\d{1,2}(?:[.:]\d{1,3})?)\]/g)];
    if(!m.length) continue;
    const text=raw.replace(/^(\s*\[\d+:\d+(?:[.:]\d+)?\])+/,'').replace(/<\d+:\d+(?:[.:]\d+)?>/g,'').trim();
    for(const x of m) out.push({t:Math.max(0,+x[1]*60+parseFloat(x[2].replace(':','.'))-off/1000), text});
  }
  return tidySynced(out.sort((a,b)=>a.t-b.t));
}
function tidySynced(L){
  const r=[];
  for(const l of L){ if(!l.text && (!r.length || !r[r.length-1].text)) continue; r.push(l); }
  while(r.length && !r[r.length-1].text) r.pop();
  return r;
}
function tidyPlain(L){
  const r=[];
  for(const l of L){ const t=(l.text||'').trim(); if(!t && (!r.length || !r[r.length-1].text)) continue; r.push({text:t}); }
  while(r.length && !r[r.length-1].text) r.pop();
  return r;
}
async function ownLyrics(s){
  const r=await api('getLyricsBySongId',{id:s.id});
  const list=(r.lyricsList?.structuredLyrics||[]).filter(l=>l.line && l.line.length);
  if(!list.length) return null;
  const p=list.find(l=>l.synced && l.kind!=='translation' && l.kind!=='pronunciation') || list.find(l=>l.synced) || list[0];
  if(p.synced){
    const off=(p.offset||0)/1000;
    const lines=tidySynced(p.line.map(x=>({t:Math.max(0,(x.start||0)/1000-off), text:(x.value||'').trim()})).sort((a,b)=>a.t-b.t));
    return lines.length ? {synced:true, lines, source:'Navidrome'} : null;
  }
  const lines=tidyPlain(p.line.map(x=>({text:x.value})));
  return lines.length ? {synced:false, lines, source:'Navidrome'} : null;
}
async function lrcFetch(path){
  const go=async h=>{
    const r=await fetch(LRC_BASE+path,{headers:h?{'Lrclib-Client':'Winkify v1.0'}:undefined});
    if(r.status===404) return null;
    if(!r.ok) throw new Error('LRCLIB '+r.status);
    return r.json();
  };
  if(lrcHdr){ try{ return await go(true); }catch(e){ if(!(e instanceof TypeError)) throw e; lrcHdr=false; } }
  return go(false);
}
function fromLrclib(rec){
  if(!rec) return null;
  if(rec.instrumental) return {instrumental:true, synced:false, lines:[], source:'LRCLIB'};
  if(rec.syncedLyrics){ const lines=parseLrc(rec.syncedLyrics); if(lines.length) return {synced:true, lines, source:'LRCLIB'}; }
  if(rec.plainLyrics){ const lines=tidyPlain(rec.plainLyrics.split(/\r?\n/).map(x=>({text:x}))); if(lines.length) return {synced:false, lines, source:'LRCLIB'}; }
  return null;
}
const cleanTitle = t => String(t||'').replace(/\s*[\(\[][^\)\]]*(feat|ft\.|remaster|live|version|edit|mix|deluxe|bonus)[^\)\]]*[\)\]]/ig,'').replace(/\s+-\s+.*(remaster|version|live|mix|edit).*$/i,'').trim();
async function lrclibLookup(s){
  const d=Math.round(s.duration||0);
  const q=new URLSearchParams({track_name:s.title, artist_name:s.artist||''});
  if(s.album) q.set('album_name',s.album);
  if(d) q.set('duration',d);
  const exact=fromLrclib(await lrcFetch('/get?'+q));
  if(exact && (exact.synced || exact.instrumental)) return exact;
  const arr=(await lrcFetch('/search?'+new URLSearchParams({track_name:cleanTitle(s.title), artist_name:s.artist||''})))||[];
  const ok=arr.filter(x=>(x.syncedLyrics||x.plainLyrics||x.instrumental) && (!d||!x.duration||Math.abs(x.duration-d)<=8));
  ok.sort((a,b)=>(!!b.syncedLyrics-!!a.syncedLyrics)||(Math.abs((a.duration||0)-d)-Math.abs((b.duration||0)-d)));

async function fetchLyrics(s){
  if(lyCache.has(s.id)) return lyCache.get(s.id);
  let own=null, ext=null, failed=false;
  try{ own=await ownLyrics(s); }catch(e){}
  if(own && own.synced){ lyCache.set(s.id,own); return own; }
  try{ ext=await lrclibLookup(s); }catch(e){ failed=true; }
  let res=(ext && (ext.synced||ext.instrumental)) ? ext : (own||ext);
  if(!res){
    try{
      const r=await api('getLyrics',{artist:s.artist,title:s.title});
      const v=r.lyrics?.value;
      if(v && v.trim()){ const lines=tidyPlain(v.split(/\r?\n/).map(x=>({text:x}))); if(lines.length) res={synced:false, lines, source:'Navidrome'}; }
    }catch(e){}
  }
  if(!(failed && !res)) lyCache.set(s.id,res);
  return res;
}
function ensureLyrics(){
  const s=cur();

/* Coda, brano e punto esatto di riproduzione vengono salvati nel browser (localStorage, condiviso tra le schede).

const PS = {kq:'winkify_pq', kt:'winkify_pt', own:false, restoring:false, lastT:0, tmr:0};
const SLIM_KEYS = ['id','title','artist','artistId','album','albumId','coverArt','duration','contentType','suffix','track','discNumber','year','genre','starred','bitRate'];
const slimSong = x => { const o={}; SLIM_KEYS.forEach(k=>{ if(x[k]!=null) o[k]=x[k]; }); return o; };
function savePT(paused){
  const s=cur(); if(!s || PS.restoring) return;
  try{ localStorage.setItem(PS.kt, JSON.stringify({id:s.id, i:P.i, t:+(audio.currentTime||0).toFixed(2), play:paused?false:!audio.paused, at:Date.now()})); }catch(e){}
}
function savePQ(now){
  if(PS.restoring) return;
  const run=()=>{
    try{
      if(!P.queue.length){ localStorage.removeItem(PS.kq); localStorage.removeItem(PS.kt); return; }
      const CAP=1000; let q=P.queue, i=P.i;
      if(q.length>CAP){ const st=Math.max(0,Math.min(P.i-200,q.length-CAP)); q=q.slice(st,st+CAP); i=P.i-st; }
      localStorage.setItem(PS.kq, JSON.stringify({v:1, srv:S.server, usr:S.user, q:q.map(slimSong), i, shuffle:P.shuffle, repeat:P.repeat, ctx:P.ctx,
        orig:(P.shuffle && P.queue.length<=CAP && P.orig.length<=CAP) ? P.orig.map(slimSong) : null}));
      savePT();
    }catch(e){}
  };
  clearTimeout(PS.tmr);
  if(now) run(); else PS.tmr=setTimeout(run,250);
}
function restorePlayer(){
  let o,tt;
  try{ o=JSON.parse(localStorage.getItem(PS.kq)||'null'); tt=JSON.parse(localStorage.getItem(PS.kt)||'null'); }catch(e){ return false; }
  if(!o || !Array.isArray(o.q) || !o.q.length || o.srv!==S.server || o.usr!==S.user) return false;
  P.queue=o.q; P.orig=(o.orig && o.orig.length) ? o.orig : o.q.slice(); P.shuffle=!!o.shuffle; P.repeat=(o.repeat|0)%3; P.ctx=o.ctx||null;
  P.i=Math.min(Math.max(0,o.i|0),o.q.length-1);
  /* il punto di riproduzione e' piu' aggiornato della coda: se c'e', e' lui a decidere il brano */
  let t=0;
  if(tt && tt.id!=null){
    const k = (P.queue[tt.i] && P.queue[tt.i].id===tt.id) ? tt.i : P.queue.findIndex(x=>x.id===tt.id);
    if(k>=0){
      P.i=k; t=Math.max(0,+tt.t||0);
      if(tt.play && Date.now()-tt.at<3500) t+=(Date.now()-tt.at)/1000;   /* l'altra scheda sta ancora suonando: la raggiungo */
    }
  }
  const s=cur(); if(!s) return false;
  if(s.duration) t=Math.min(t,s.duration);
  PS.restoring=true; scrobbled=false;
  audio.src=apiUrl('stream',{id:s.id});
  try{ localAudio.currentTime=t; }catch(e){}
  const done=()=>{ PS.restoring=false; updateProgress(); };
  localAudio.addEventListener('loadedmetadata',()=>{ try{ if(Math.abs(localAudio.currentTime-t)>.4) localAudio.currentTime=t; }catch(e){} setTimeout(done,150); },{once:true});
  setTimeout(()=>{ if(PS.restoring) done(); },4000);
  updateUI(); setMedia(s); renderQueue(); updateProgress();
  return true;
}

  const gr=c.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,`rgb(${r},${g},${b})`);
  gr.addColorStop(1,`rgb(${Math.round(r*.32)},${Math.round(g*.32)},${Math.round(b*.32)})`);
  c.fillStyle=gr; c.fillRect(0,0,W,H);
  /* copertina */
  const cs=240, cx=M, cy=120;
  c.save(); c.shadowColor='rgba(0,0,0,.45)'; c.shadowBlur=40; c.shadowOffsetY=12; rrect(c,cx,cy,cs,cs,16); c.fillStyle='#282828'; c.fill(); c.restore();
  c.save(); rrect(c,cx,cy,cs,cs,16); c.clip();
  if(img) c.drawImage(img,cx,cy,cs,cs);
  else{ c.fillStyle='#282828'; c.fillRect(cx,cy,cs,cs); c.translate(cx+cs/2-48,cy+cs/2-48); c.scale(4,4); c.fillStyle='#7f7f7f'; c.fill(new Path2D(ICONS.note)); }
  c.restore();
  /* titolo e artista */
  const tx=cx+cs+36, tw=W-M-tx;
  c.textBaseline='alphabetic'; c.textAlign='left';
  c.font=`800 54px ${F}`; const tl=clampLines(c,s.title||'',tw,2);
  c.font=`500 38px ${F}`; const al=clampLines(c,s.artist||'',tw,1);
  const blockH=tl.length*64+50; let y=cy+(cs-blockH)/2+48;
  c.fillStyle='#fff'; c.font=`800 54px ${F}`; tl.forEach(l=>{ c.fillText(l,tx,y); y+=64; });
  c.fillStyle='rgba(255,255,255,.78)'; c.font=`500 38px ${F}`; c.fillText(al[0],tx,y-6);
  /* testi: fino al verso raggiunto */
  const areaTop=470, areaH=1090, maxW=W-2*M; let best=null;
  for(let size=84;size>=44;size-=4){
    c.font=`800 ${size}px ${F}`;
    const lh=Math.round(size*1.2), gap=Math.round(size*.32);
    const blocks=snap.lines.map(t=>wrapTxt(c,t,maxW));
    const calc=bs=>bs.reduce((a,l)=>a+l.length*lh,0)+gap*(bs.length-1);
    let st=0; while(st<blocks.length-1 && calc(blocks.slice(st))>areaH) st++;
    const used=blocks.slice(st);
    best={size,lh,gap,used,total:calc(used)};
    if(best.total<=areaH && (used.length>=Math.min(4,blocks.length))) break;
  }
  c.font=`800 ${best.size}px ${F}`;
  let ly=areaTop+Math.max(0,(areaH-best.total)/2);
  best.used.forEach((blk,j)=>{
    const dist=best.used.length-1-j;
    c.fillStyle=`rgba(255,255,255,${dist===0?1:Math.max(.3,.62-.08*(dist-1))})`;
    blk.forEach(l=>{ c.fillText(l,M,ly+Math.round(best.lh*.82)); ly+=best.lh; });
    ly+=best.gap;
  });
  /* progresso: "a quale punto" della canzone */
  const d=s.duration||audio.duration||0, f=d?Math.min(1,snap.t/d):0, by=1650, bw=W-2*M;
  c.fillStyle='rgba(255,255,255,.3)'; rrect(c,M,by,bw,8,4); c.fill();
  c.fillStyle='#fff'; rrect(c,M,by,Math.max(8,bw*f),8,4); c.fill();
  c.beginPath(); c.arc(M+bw*f,by+4,13,0,Math.PI*2); c.fill();
  c.font=`500 28px ${F}`; c.fillStyle='rgba(255,255,255,.78)';
  c.textAlign='left'; c.fillText(fmt(snap.t),M,by+62);
  c.textAlign='right'; c.fillText(fmt(d),W-M,by+62); c.textAlign='left';
  /* marchio */
  const mark=await loadImg(wkUri('round',224));
  if(mark) c.drawImage(mark,M,1770,56,56);
  c.font=`800 44px ${F}`; c.fillStyle='#fff'; c.fillText('Winkify',M+78,1770+43);
  return new Promise((res,rej)=>cv.toBlob(bl=>bl?res(bl):rej(new Error('toBlob')),'image/png'));
}

function handleAct(a,e){
  const act=a.dataset.act;
  switch(act){
    case 'back': history.back(); break;
    case 'fwd': history.forward(); break;
    case 'playpause': togglePlay(); break;
    case 'next': next(); break;
    case 'prev': prev(); break;
    case 'shuffle': toggleShuffle(); break;
    case 'repeat': P.repeat=(P.repeat+1)%3; updateUI(); PS.own=true; savePQ(); break;
    case 'lyrics': toggleLyrics(); break;
    case 'lyrclose': closeLyrics(); break;
    case 'queue': toggleQueue(); if(isMobile() && $('#app').classList.contains('q-open')) $('#fp').classList.remove('open'); break;
    case 'mute': audio.muted=!audio.muted; updateVol(); break;
    case 'share': openShare(); break;
    case 'shdl': downloadShare(); break;
    case 'shshare': nativeShare(); break;
    case 'shclose': if(a.id==='shm' && e.target!==a) break; closeShare(); break;
    case 'fullscreen': toggleFs(); break;
    case 'fpclose': closeFp(); break;
    case 'wrapped': openWrapped(); break;
    case 'wrclose': closeWrapped(); break;
    case 'wrmute': WR.mute=!WR.mute; if(WR.aud) WR.aud.muted=WR.mute; $('#wrmu').innerHTML=wrIc(WR.mute?'mute':'vol'); break;
    case 'wrreplay': wrGo(0); break;
    case 'wrretry': wrGenerate(); break;
    case 'wrdl': wrExport(false); break;
    case 'wrshare': wrExport(true); break;
    case 'setclose': closeSettings(); break;
    case 'setclosebg': if(e.target===a) closeSettings(); break;
    case 'plmenu': { const r=a.getBoundingClientRect(); showMenu(r.left,r.bottom+4,plMenuItems(a.dataset.id)); e.stopPropagation(); break; }
    case 'mixplay': { e.preventDefault(); e.stopPropagation(); const k=a.dataset.mix, m=MIX[k]; if(m){ if(P.ctx==='mix:'+k && cur()) togglePlay(); else playList(m.songs,0,{ctx:'mix:'+k}); } break; }
    case 'resumeplay': { e.preventDefault(); e.stopPropagation(); if(cur()){ audio.paused ? audio.play() : audio.pause(); } break; }
    case 'castopen': openCast(); break;
    case 'castclosebg': if(e.target===a) closeCast(); break;
    case 'castphone': if(CAST.on) castBackToPhone(); closeCast(); break;
    case 'castclose': closeCast(); break;
    case 'castpick': closeCast(); try{ castCtx().requestSession().then(err=>{ if(err && err!=='cancel') toast('Impossibile connettersi al dispositivo'); }); }catch(x){ toast('Google Cast non disponibile'); } break;
    case 'artistcard': if(AC.key){ closeFp(); location.hash='#/artist/'+AC.key; } break;
    case 'fpmore': { const s=cur(); if(s){ const r=a.getBoundingClientRect(); showMenu(r.left-180,r.bottom,songMenu(s,[['Impostazioni di riproduzione…',()=>setTimeout(openSettings,0)]])); e.stopPropagation(); } break; }
    case 'heartcur': { const s=cur(); if(s) toggleStar(s.id); break; }
    case 'heart': e.preventDefault(); toggleStar(a.dataset.id); break;
    case 'heartalbum': toggleStar(a.dataset.id,true); break;
    case 'more': { e.preventDefault(); const row=a.closest('.row'); const r=a.getBoundingClientRect(); rowMenu(row,r.left-160,r.bottom); e.stopPropagation(); break; }
    case 'rowplay': e.preventDefault(); playRow(a.closest('.row')); break;
    case 'cardplay': e.preventDefault(); e.stopPropagation(); { const t=a.dataset.type,id=a.dataset.id; if(P.ctx===t+':'+id && cur()) togglePlay(); else playEntity(t,id); } break;
    case 'ctxplay': {
      const ctx=a.dataset.ctx;
      if(P.ctx===ctx && cur()){ togglePlay(); break; }
      const list=LISTS[+a.dataset.l];
      if(list && list.length) playList(list,0,{ctx,random:P.shuffle}); else { const [t,id]=ctx.split(/:(.+)/); playEntity(t,id,{random:P.shuffle}); }
      break; }
    case 'ctxshuffle': {
      const ctx=a.dataset.sctx; P.shuffle=true;
      const list=LISTS[+a.dataset.l];
      if(list && list.length) playList(list,0,{ctx,random:true}); else { const [t,id]=ctx.split(/:(.+)/); playEntity(t,id,{random:true}); }
      break; }
    case 'libfilter': LIB.filter = LIB.filter===a.dataset.f ? null : a.dataset.f; renderLibrary(); break;
    case 'libsort': LIB.sort = LIB.sort==='recent'?'alpha':'recent'; renderLibrary(); break;
    case 'sfilter': SF=a.dataset.f; renderSearch(); break;
    case 'usermenu': { const r=a.getBoundingClientRect(); showMenu(r.right-230,r.bottom+8,[[`Connesso come ${S.user}`,()=>{}],['Winkify Wrapped',()=>setTimeout(()=>{ if(window.openWrapped) openWrapped(); },0)],['Impostazioni di riproduzione',()=>setTimeout(openSettings,0)],['Esci',logout]]); e.stopPropagation(); break; }
  }
}

let DLG=null;
function dlg({title,text='',input=null,ok='OK',danger=false,cancel='Annulla'}){
  return new Promise(res=>{
    const d=$('#dlg'), i=$('#dlgi'), o=$('#dlgo'), c=$('#dlgc');

    const end=v=>{ if(!DLG) return; DLG=null; d.classList.remove('on'); res(v); };
    DLG=end;
    o.onclick=()=>end(input!=null ? i.value : true);
    c.onclick=()=>end(null);
    d.onclick=e=>{ if(e.target===d) end(null); };

  });
}

function mixCard(key,name,songs){
  const covs=[...new Set(songs.map(s=>s.coverArt).filter(Boolean))].slice(0,4);
  const [r,g,b]=hashColor(name);
  const artists=[...new Set(songs.map(s=>s.artist).filter(Boolean))].slice(0,3);
  const four=covs.length>=4;
  const mosaic = four ? covs.map(c=>`<img loading="lazy" decoding="async" src="${coverUrl(c,200)}" alt="">`).join('') : (covs[0]?`<img class="one" loading="lazy" decoding="async" src="${coverUrl(covs[0],400)}" alt="">`:'');
  return `<div class="card mixc" data-act="mixplay" data-mix="${esc(key)}" role="button"><div class="ci"><div class="mixart ${four?'m4':''}" style="--mc:${r},${g},${b}">${mosaic}<div class="mixtint"></div><span class="mixlogo">${logoSvg(22)}</span><span class="mixname">${esc(name)}</span></div><button class="cplay" data-act="mixplay" data-mix="${esc(key)}" aria-label="Riproduci">${ic('play',24)}</button></div><div class="cs" style="margin-top:8px">${artists.length?'Con '+artists.map(esc).join(', ')+' e altri':'Mix per te'}</div></div>`;
}

async function vHome(){

    api('getStarred2').then(r=>r.starred2?.song||[]).catch(()=>[])
  ]);
  const hr=new Date().getHours(); const evening = hr>=19 || hr<5;
  const g = hr<6?'Buonanotte':hr<13?'Buongiorno':hr<19?'Buon pomeriggio':'Buonasera';
  /* accesso rapido */

  /* mix generati al volo */
  Object.keys(MIX).forEach(k=>delete MIX[k]);
  const mixes=[]; const addMix=(key,name,songs)=>{ if(songs.length<8) return; MIX[key]={name,songs}; mixes.push(mixCard(key,name,songs)); };
  addMix('daily','Mix del giorno',shuf(rnd));
  if(st.length>=8) addMix('liked','Dal cuore',shuf(st).slice(0,60));
  const day=Math.floor(Date.now()/864e5);
  const topG=genres.filter(x=>x.songCount>=10).sort((a,b)=>b.songCount-a.songCount).slice(0,8);
  const pick=topG.length>3 ? [0,1,2].map(k=>topG[(day+k)%topG.length]) : topG.slice(0,3);
  const gs=await Promise.all(pick.map(x=>api('getSongsByGenre',{genre:x.value||x.name,count:60}).then(r=>r.songsByGenre?.song||[]).catch(()=>[])));
  pick.forEach((x,k)=>addMix('g'+k,'Mix '+(x.value||x.name),shuf(gs[k])));
  /* artisti del momento (dagli ascolti) */
  const am=new Map();
  [...fq,...rc].forEach(a=>{ if(!a.artistId) return; const e=am.get(a.artistId)||{id:a.artistId,name:a.artist,w:0}; e.w+=(a.playCount||1); am.set(a.artistId,e); });
  const topAr=[...am.values()].sort((a,b)=>b.w-a.w).slice(0,10).map(x=>{ const la=LIB.artists.find(y=>y.id===x.id); return {id:x.id,name:x.name,coverArt:(la&&la.coverArt)||x.id}; });
  /* "Perché hai ascoltato…" */

  }catch(e){}

  const wrb=`<section class="shelf"><div class="wrb" data-act="wrapped" role="button"><div class="wrbg"></div><div class="wrt"><span class="wrk">Winkify</span><b>Wrapped</b><i>Il riepilogo animato dei tuoi ascolti, quando vuoi.</i></div><span class="wrgo">Genera il mio Wrapped</span></div></section>`;
  const secMix = mixes.length ? shelf('Mix per te', mixes.join('')) : '';
  const secRec = shelf('Ascoltati di recente', rc.map(albumCard).join(''));
  const secs = evening ? [secRec,secMix] : [secMix,secRec];

  html += shelf('Da riscoprire', rd.map(albumCard).join(''));

  if(!nw.length && !rc.length && !rd.length) html += `<div class="empty"><h3>Ancora niente da mostrare</h3>Aggiungi musica al tuo Navidrome per iniziare.</div>`;
  return {html, hero:[70,70,90], heroA:.55};
}

/* ---------- SCHERMATA DI BLOCCO / NOTIFICA (Media Session) ---------- */
/* Chrome espone solo le azioni standard: play, pausa, precedente, successivo, ±10 s, barra di avanzamento, stop. */
const MS_SIZES=[96,128,192,256,384,512];
function setMedia(s){
  if(!('mediaSession' in navigator)) return;
  try{
    navigator.mediaSession.metadata = new MediaMetadata({title:s.title||'',artist:s.artist||'',album:s.album||'',
      artwork: s.coverArt ? MS_SIZES.map(n=>({src:coverUrl(s.coverArt,n),sizes:n+'x'+n,type:'image/jpeg'})) : []});
  }catch(e){}
}
function msPos(){
  if(!('mediaSession' in navigator) || !navigator.mediaSession.setPositionState) return;
  const d=audio.duration, t=audio.currentTime;
  if(!d || !isFinite(d)) return;
  try{ navigator.mediaSession.setPositionState({duration:d,position:Math.max(0,Math.min(t,d)),playbackRate:audio.playbackRate||1}); }catch(e){}
}
if('mediaSession' in navigator){
  const ms=navigator.mediaSession;
  const seekBy=o=>{ const d=audio.duration||0; audio.currentTime=Math.max(0,Math.min(d||1e9,(audio.currentTime||0)+o)); msPos(); };
  [['play',()=>audio.play()],['pause',()=>audio.pause()],['stop',()=>{ audio.pause(); }],
   ['previoustrack',prev],['nexttrack',()=>next()],
   ['seekbackward',d=>seekBy(-((d&&d.seekOffset)||10))],['seekforward',d=>seekBy((d&&d.seekOffset)||10)],
   ['seekto',d=>{ if(d.seekTime!=null){ if(d.fastSeek && audio.fastSeek) audio.fastSeek(d.seekTime); else audio.currentTime=d.seekTime; msPos(); } }]
  ].forEach(([a,f])=>{ try{ms.setActionHandler(a,f);}catch(e){} });
  audio.addEventListener('seeked',msPos); audio.addEventListener('durationchange',msPos);
  audio.addEventListener('play',msPos); audio.addEventListener('pause',msPos);
}

/* ================= WINKIFY WRAPPED ================= */
/* Dati: i conteggi di ascolto che Navidrome conserva per ogni brano (OpenSubsonic: playCount). Sono conteggi "di sempre": le API
   Subsonic non espongono lo storico per periodo. Si parte dagli album piu' ascoltati (getAlbumList2 type=frequent) e si leggono i brani. */
const WR = {open:false, data:null, slides:[], i:0, el:0, ts:0, paused:false, held:false, pd:null, holdT:0, raf:0, aud:null, cs:null, mute:false, ft:0, resumeMain:false, building:false, run:0};
const wrN = n => new Intl.NumberFormat('it-IT').format(Math.round(n));
const wrCap = s => s ? s.charAt(0).toUpperCase()+s.slice(1) : '';
const wrImg = (id,size=300) => id ? `<img alt="" src="${coverUrl(id,size)}" onerror="this.remove()">` : '';
const wrL = (t,d0=0,st=.055) => [...t].map((c,i)=>`<span class="wl" style="--d:${(d0+i*st).toFixed(2)}s">${c===' '?'&nbsp;':esc(c)}</span>`).join('');
const wrFit = (txt,max,min,k) => Math.max(min,Math.min(max,k/Math.max(1,String(txt).length)));   /* corpo del testo in cqw */

async function wrBuild(prog){
  const albums=[];
  for(let off=0; off<2500; off+=500){
    const r=await api('getAlbumList2',{type:'frequent',size:500,offset:off});
    const a=r.albumList2?.album||[]; albums.push(...a); prog('Leggo la tua libreria…',albums.length,0);
    if(a.length<500) break;
  }
  if(!albums.length) throw new Error('EMPTY');
  const top=albums.slice(0,250), songs=[]; let done=0; const q=top.slice();
  await Promise.all(Array.from({length:6},async()=>{
    while(q.length){
      const al=q.shift();
      try{ const r=await api('getAlbum',{id:al.id}); (r.album?.song||[]).forEach(s=>{ if(s.playCount>0) songs.push(s); }); }catch(e){}
      prog('Conto i tuoi ascolti…',++done,top.length);
    }
  }));
  if(!songs.length) throw new Error(top.some(a=>a.playCount!=null)?'EMPTY':'NOCOUNT');
  const plays=songs.reduce((t,s)=>t+s.playCount,0);
  const minutes=songs.reduce((t,s)=>t+s.playCount*(s.duration||0),0)/60;
  const aMap=new Map(), alMap=new Map(), gMap=new Map();
  songs.forEach(s=>{
    const ak=s.artistId||s.artist||'?'; const a=aMap.get(ak)||{id:s.artistId,name:s.artist||'Sconosciuto',plays:0,minutes:0,cover:s.artistId||s.coverArt}; a.plays+=s.playCount; a.minutes+=s.playCount*(s.duration||0)/60; aMap.set(ak,a);
    const lk=s.albumId||s.album||'?'; const l=alMap.get(lk)||{id:s.albumId,name:s.album||'Sconosciuto',artist:s.artist,coverArt:s.coverArt||s.albumId,plays:0}; l.plays+=s.playCount; alMap.set(lk,l);
    const gl=(s.genres&&s.genres.length?s.genres.map(g=>g.name):(s.genre?[s.genre]:[]));
    gl.forEach(n=>gMap.set(n,(gMap.get(n)||0)+s.playCount/gl.length));
  });
  const topArtists=[...aMap.values()].sort((a,b)=>b.plays-a.plays).slice(0,5);
  const topSongs=songs.slice().sort((a,b)=>b.playCount-a.playCount||(b.duration||0)-(a.duration||0)).slice(0,5).map(s=>({id:s.id,title:s.title,artist:s.artist,artistId:s.artistId,albumId:s.albumId,coverArt:s.coverArt||s.albumId,plays:s.playCount,duration:s.duration||0}));
  const topAlbums=[...alMap.values()].sort((a,b)=>b.plays-a.plays).slice(0,5);
  const gTot=[...gMap.values()].reduce((a,b)=>a+b,0)||1;
  const genres=[...gMap.entries()].sort((a,b)=>b[1]-a[1]).slice(0,5).map(([name,v])=>({name,plays:v,p:v/gTot}));
  const D={user:wrCap(S.user), plays, minutes, songsN:songs.length, artistsN:aMap.size, albumsN:alMap.size, topArtists, topSongs, topAlbums, genres, date:new Date()};
  D.type=wrType(D);
  const rg=a=>a.map(x=>Math.round(x*.82));
  const [c1,c2,c3]=await Promise.all([dom(topArtists[0].cover),dom(topSongs[0].coverArt),dom(topAlbums[0].coverArt)]);
  D.c={artist:rg(c1),song:rg(c2),album:rg(c3)};
  /* brano piu' ascoltato del primo artista (per la musica di sottofondo) */
  D.artistSong=topSongs.find(s=>s.artistId===topArtists[0].id) || songs.filter(s=>s.artistId===topArtists[0].id).sort((a,b)=>b.playCount-a.playCount)[0] || topSongs[0];
  D.albumSong=songs.filter(s=>s.albumId===topAlbums[0].id).sort((a,b)=>b.playCount-a.playCount)[0] || topSongs[0];
  return D;
}
function wrType(D){
  const share=D.topArtists[0].plays/D.plays, avg=D.plays/D.songsN, g0=D.genres[0], t0=D.topSongs[0];
  if(share>=.3) return {k:'Il Fedelissimo', d:`Un solo artista, ${D.topArtists[0].name}, ha firmato il ${Math.round(share*100)}% dei tuoi ascolti. Sai cosa ti piace e non ti fermi.`};
  if(t0.plays>=Math.max(15,avg*6)) return {k:'Il Replay-maniaco', d:`Hai riascoltato «${t0.title}» ${wrN(t0.plays)} volte. Quando un brano ti prende, non lo molli più.`};
  if(g0 && g0.p>=.5) return {k:'Il Purista', d:`Il ${Math.round(g0.p*100)}% della tua musica è ${g0.name}. Hai trovato la tua casa musicale.`};
  if(D.artistsN>=40 && share<.12) return {k:"L'Esploratore", d:`${wrN(D.artistsN)} artisti diversi e nessun favorito schiacciante. La curiosità è il tuo superpotere.`};
  return {k:'Il Collezionista', d:`Un po' di tutto, ben distribuito: ${wrN(D.artistsN)} artisti e ${wrN(D.songsN)} brani diversi. Il tuo gusto non ha confini.`};
}
function wrCompare(min){
  const days=min/1440, hrs=min/60;
  if(days>=2) return `Sono quasi <b>${days.toFixed(days<10?1:0).replace('.',',')} giorni</b> di musica di fila, senza dormire né mangiare.`;
  if(hrs>=2) return `Sono <b>${hrs.toFixed(hrs<10?1:0).replace('.',',')} ore</b> di musica: una maratona in piena regola.`;
  return `Un ottimo inizio: continua ad ascoltare e il prossimo Wrapped sarà ancora più ricco.`;
}

/* ---------- regia ---------- */
function wrCount(root){
  root.querySelectorAll('[data-count]').forEach(el=>{
    const to=+el.dataset.count, d=+(el.dataset.dur||1800), t0=performance.now()+(+el.dataset.delay||0);
    const step=t=>{ if(!el.isConnected) return; const p=Math.max(0,Math.min(1,(t-t0)/d)); el.textContent=wrN(to*(1-Math.pow(1-p,4))); if(p<1) requestAnimationFrame(step); };
    el.textContent='0'; requestAnimationFrame(step);
  });
}
function wrFade(a,v,ms,cb){
  clearInterval(WR.ft); const v0=a.volume, t0=performance.now();
  WR.ft=setInterval(()=>{ const p=Math.min(1,(performance.now()-t0)/ms); try{ a.volume=Math.max(0,Math.min(1,v0+(v-v0)*p)); }catch(e){} if(p>=1){ clearInterval(WR.ft); cb&&cb(); } },30);
}
function wrAudio(song){
  if(song===undefined) return;
  const a=WR.aud||(WR.aud=new Audio()); a.preload='auto';
  if(!song){ wrFade(a,0,500,()=>a.pause()); WR.cs=null; return; }
  if(WR.cs===song.id) return;
  WR.cs=song.id;
  const go=()=>{
    a.pause(); a.src=apiUrl('stream',{id:song.id}); try{ a.volume=0; }catch(e){} a.muted=WR.mute;
    a.onloadedmetadata=()=>{ try{ const d=a.duration||song.duration||180; a.currentTime=Math.max(0,Math.min(d*.33,d-45)); }catch(e){} a.play().then(()=>wrFade(a,.85,1600)).catch(()=>{}); };
  };
  if(!a.paused && a.volume>0.02) wrFade(a,0,350,go); else go();
}
function wrShow(i){
  if(!WR.slides.length) return;
  i=Math.max(0,Math.min(WR.slides.length-1,i)); WR.i=i; WR.el=0;
  const sl=WR.slides[i], host=$('#wrh');
  host.innerHTML=sl.html();
  const bars=[...$('#wrp').children]; bars.forEach((b,k)=>{ b.firstChild.style.transform=`scaleX(${k<i?1:0})`; });
  wrCount(host); wrAudio(sl.song);
  const c=getComputedStyle(host.firstElementChild).getPropertyValue('--a').trim(); if(c) $('#wrbd').style.setProperty('--bd',c);
}
function wrGo(i){ if(i<0) i=0; if(i>=WR.slides.length) return; wrShow(i); }
function wrPause(on){ WR.paused=on; $('#wrs').classList.toggle('hold',on); if(WR.aud && !WR.aud.paused && on) WR.aud.pause(); else if(WR.aud && !on && WR.cs && WR.aud.paused) WR.aud.play().catch(()=>{}); }
function wrLoop(ts){
  if(!WR.open) return;
  const dt=Math.min(120,ts-(WR.ts||ts)); WR.ts=ts;
  if(!WR.paused && WR.slides.length){
    WR.el+=dt; const sl=WR.slides[WR.i], b=$('#wrp').children[WR.i];
    if(b){ const p=sl.dur?Math.min(1,WR.el/sl.dur):1; b.firstChild.style.transform=`scaleX(${p})`; if(sl.dur && p>=1 && WR.i<WR.slides.length-1) wrShow(WR.i+1); }
  }
  WR.raf=requestAnimationFrame(wrLoop);
}

  <div class="wk">Winkify Wrapped</div><div class="wsub" id="wrld">${esc(msg)}</div></div>`;
function wrError(code){
  const m = code==='NOCOUNT' ? ['Il tuo Navidrome non espone i conteggi di ascolto.','Aggiorna Navidrome a una versione recente (OpenSubsonic) per poter generare il Wrapped.']
          : code==='EMPTY' ? ['Non ci sono ancora abbastanza ascolti.','Ascolta qualche brano da Winkify (o da un altro client collegato a Navidrome) e riprova: gli ascolti vengono registrati a metà brano.']
          : ['Non sono riuscito a leggere i tuoi ascolti.','Controlla la connessione al server e riprova.'];
  $('#wrh').innerHTML=`<div class="wsl wld werr" style="--a:#2a1020;--b:#000;--c:rgba(236,72,153,.3);--c2:rgba(124,58,237,.25)"><div class="wk wup">Winkify Wrapped</div><div class="wtit wup" style="--d:.15s;font-size:7cqw">${esc(m[0])}</div><div class="wsub wup" style="--d:.3s">${esc(m[1])}</div>
    <div class="wbtns wup" style="--d:.45s"><button class="wbtn" data-act="wrretry">Riprova</button><button class="wbtn sec" data-act="wrclose">Chiudi</button></div></div>`;
  $('#wrp').innerHTML='';
}
async function openWrapped(){
  if(WR.open || !S) return;
  WR.open=true; WR.paused=false; WR.i=0; WR.slides=[];
  WR.resumeMain = !audio.paused; if(WR.resumeMain) audio.pause();
  $('#wr').classList.add('on'); $('#wrp').innerHTML=''; $('#wrbd').style.setProperty('--bd','#1ed760');
  $('#wrmu').innerHTML=WR.mute?wrIc('mute'):wrIc('vol'); $('#wrcl').innerHTML=wrIc('close');
  WR.ts=0; cancelAnimationFrame(WR.raf); WR.raf=requestAnimationFrame(wrLoop);
  await wrGenerate();
}
async function wrGenerate(){
  const my=++WR.run;
  $('#wrh').innerHTML=wrLoader(); $('#wrp').innerHTML=''; wrAudio(null);
  try{
    const D=await wrBuild((msg,n,t)=>{ const e=$('#wrld'); if(e && my===WR.run) e.textContent = t?`${msg} ${n} / ${t}`:`${msg} ${wrN(n)} album`; });
    if(my!==WR.run || !WR.open) return;
    WR.data=D; WR.slides=wrSlides(D);
    $('#wrp').innerHTML=WR.slides.map(()=>'<i><b></b></i>').join('');
    wrShow(0);
  }catch(e){ if(my===WR.run && WR.open) wrError(e && e.message); }
}
function closeWrapped(){
  if(!WR.open) return;
  WR.open=false; WR.run++; cancelAnimationFrame(WR.raf); clearInterval(WR.ft);
  if(WR.aud){ WR.aud.pause(); WR.cs=null; }
  $('#wr').classList.remove('on'); $('#wrh').innerHTML=''; $('#wrs').classList.remove('hold');
  if(WR.resumeMain){ WR.resumeMain=false; audio.play().catch(()=>{}); }
}
const wrIc = n => `<svg viewBox="0 0 24 24" fill="currentColor"><path d="${ICONS[n]}"/></svg>`;
function wrKey(e){
  if(e.code==='Escape'){ closeWrapped(); }
  else if(e.code==='ArrowRight') wrGo(WR.i+1);
  else if(e.code==='ArrowLeft') wrGo(WR.i-1);
  else if(e.code==='Space'){ e.preventDefault(); wrPause(!WR.paused); }
}
(function(){
  const st=$('#wrs');
  st.addEventListener('pointerdown',e=>{ if(e.target.closest('button,a')) return; WR.pd=1; clearTimeout(WR.holdT); WR.holdT=setTimeout(()=>{ WR.held=true; wrPause(true); },240); });
  st.addEventListener('pointerup',e=>{
    clearTimeout(WR.holdT);
    if(WR.held){ WR.held=false; WR.pd=null; wrPause(false); return; }
    if(!WR.pd || e.target.closest('button,a')){ WR.pd=null; return; }
    WR.pd=null; const r=st.getBoundingClientRect();
    (e.clientX-r.left<r.width*.33) ? wrGo(WR.i-1) : wrGo(WR.i+1);
  });
  st.addEventListener('pointercancel',()=>{ clearTimeout(WR.holdT); if(WR.held){ WR.held=false; wrPause(false); } WR.pd=null; });
  st.addEventListener('contextmenu',e=>e.preventDefault());
})();

/* ---------- immagine da condividere (poster 1080x1920) ---------- */
async function wrPoster(){
  const D=WR.data, W=1080, H=1920, M=70, F=FONT_STACK;
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H; const c=cv.getContext('2d');
  const g=c.createLinearGradient(0,0,W*.4,H); g.addColorStop(0,'#1ed760'); g.addColorStop(.55,'#5b21b6'); g.addColorStop(1,'#be185d'); c.fillStyle=g; c.fillRect(0,0,W,H);
  c.fillStyle='rgba(255,255,255,.1)'; c.beginPath(); c.arc(W*.95,H*.08,360,0,7); c.fill(); c.fillStyle='rgba(0,0,0,.14)'; c.beginPath(); c.arc(-60,H*.92,420,0,7); c.fill();
  const imgs=await Promise.all([...D.topArtists.map(a=>loadImg(coverUrl(a.cover,200))),...D.topSongs.map(s=>loadImg(coverUrl(s.coverArt,200))),loadImg(wkUri('round',200))]);
  const fit=(t,w)=>{ let s=String(t); while(s.length>1 && c.measureText(s).width>w) s=s.slice(0,-1); return s.length<String(t).length ? s.trimEnd()+'…' : s; };
  c.textBaseline='alphabetic'; c.fillStyle='#fff';
  if(imgs[10]) c.drawImage(imgs[10],M,90,96,96);
  c.font=`900 62px ${F}`; c.fillText('Winkify Wrapped',M+120,138);
  c.font=`600 32px ${F}`; c.fillStyle='rgba(255,255,255,.85)'; c.fillText(`${D.user} • ${D.date.toLocaleDateString('it-IT',{day:'numeric',month:'long',year:'numeric'})}`,M+120,182);
  c.fillStyle='#fff'; c.font=`900 210px ${F}`; c.fillText(wrN(D.minutes),M-6,420);
  c.font=`800 44px ${F}`; c.fillText('MINUTI DI MUSICA',M,486);
  const sec=(title,y,list,imgOff,sq)=>{
    c.fillStyle='rgba(0,0,0,.26)'; c.beginPath(); c.roundRect(M-20,y,W-2*M+40,520,34); c.fill();
    c.fillStyle='rgba(255,255,255,.85)'; c.font=`800 32px ${F}`; c.fillText(title.toUpperCase().split('').join('\u200A'),M+10,y+60);
    list.forEach((it,i)=>{
      const ry=y+88+i*84, im=imgs[imgOff+i];
      c.fillStyle='#fff'; c.font=`900 44px ${F}`; c.textAlign='center'; c.fillText(String(i+1),M+30,ry+54); c.textAlign='left';
      c.save(); c.beginPath(); if(sq) c.roundRect(M+80,ry+6,68,68,12); else c.arc(M+114,ry+40,34,0,7); c.clip();
      if(im) c.drawImage(im,M+80,ry+6,68,68); else { c.fillStyle='rgba(255,255,255,.25)'; c.fillRect(M+80,ry+6,68,68); }
      c.restore();
      c.fillStyle='#fff'; c.font=`800 38px ${F}`; c.fillText(fit(it.t,W-2*M-300),M+172,ry+40);
      c.fillStyle='rgba(255,255,255,.8)'; c.font=`500 28px ${F}`; c.fillText(fit(it.s,W-2*M-300),M+172,ry+70);
    });
  };
  sec('I miei artisti',560,D.topArtists.map(a=>({t:a.name,s:wrN(a.plays)+' ascolti'})),0,false);
  sec('I miei brani',1110,D.topSongs.map(s=>({t:s.title,s:s.artist+' • '+wrN(s.plays)+' ascolti'})),5,true);
  c.fillStyle='#fff'; c.font=`800 40px ${F}`; c.fillText((D.genres[0]?D.genres[0].name+' • ':'')+D.type.k,M,1730);
  c.font=`500 30px ${F}`; c.fillStyle='rgba(255,255,255,.85)'; c.fillText(`${wrN(D.plays)} ascolti • ${wrN(D.songsN)} brani • ${wrN(D.artistsN)} artisti`,M,1782);
  c.font=`800 34px ${F}`; c.fillStyle='rgba(255,255,255,.9)'; c.fillText('winkify',M,1860);
  return new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(new Error('toBlob')),'image/png'));
}
async function wrExport(share){
  try{
    toast('Genero l\'immagine…'); const blob=await wrPoster();
    const file=new File([blob],`Winkify Wrapped - ${WR.data.user}.png`,{type:'image/png'});
    if(share && navigator.canShare && navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file],title:'Il mio Winkify Wrapped'}); return; }catch(e){ if(e.name==='AbortError') return; } }
    const u=URL.createObjectURL(blob), a=document.createElement('a'); a.href=u; a.download=file.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000);
    toast('Immagine scaricata');
  }catch(e){ toast('Impossibile generare l\'immagine'); }
}

if(S && S.server && S.token){ startApp(); }
else { S=null; try{ $('#lsrv').value=localStorage.getItem('winkify_last_srv')||''; }catch(e){} initStaticIcons(); }
$('#lsrv').addEventListener('change',()=>{ try{localStorage.setItem('winkify_last_srv',$('#lsrv').value);}catch(e){} });
</script>
